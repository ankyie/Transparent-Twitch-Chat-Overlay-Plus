<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TTCO+ Manager</title>
  <link rel="stylesheet" href="manager.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <button type="button" class="brand" data-view="welcome" title="Home: welcome page, quick add &amp; tips">
        <svg viewBox="0 0 1024 1024" class="logo" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b48cff"/><stop offset="1" stop-color="#6a3cf0"/></linearGradient></defs><rect x="64" y="64" width="896" height="896" rx="220" fill="url(#lg)"/><path d="M272 300h480a56 56 0 0 1 56 56v260a56 56 0 0 1-56 56H520l-140 110v-110H272a56 56 0 0 1-56-56V356a56 56 0 0 1 56-56z" fill="#fff" fill-opacity=".92"/><rect x="318" y="410" width="250" height="44" rx="22" fill="#7c4dff"/><rect x="318" y="500" width="380" height="44" rx="22" fill="#7c4dff" fill-opacity=".55"/></svg>
        <span>
          <span class="brand-name">TTCO<span>+</span></span>
          <span class="brand-sub">Transparent chat overlay</span>
        </span>
      </button>

      <div class="quick" id="quick"></div>
      <div id="banner"></div>

      <div class="lists">
        <div class="list-head">
          <span>On screen</span>
          <button class="btn sm primary" id="btn-new" title="Create a new overlay">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> New
          </button>
        </div>
        <div id="list-visible" class="list" data-list="visible"></div>
        <div class="list-head">
          <span>Hidden <em id="hidden-count"></em></span>
          <small class="muted">kept, not on screen</small>
        </div>
        <div id="list-hidden" class="list" data-list="hidden"></div>
      </div>

      <nav class="nav">
        <button data-view="layouts"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Layouts</button>
        <button data-view="trash"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>Trash <em id="trash-count"></em></button>
        <button data-view="settings"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>Settings</button>
      </nav>
    </aside>

    <main id="main"></main>
  </div>

  <datalist id="font-list"></datalist>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script type="module" src="manager.js"></script>
</body>
</html>
